<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;height:100%}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}

<body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: one game card centered on a powder-blue room; touch pad under the card on touch devices.
   Single deliberate look (Luru's apricot fur on powder blue), set explicitly for every host theme. */
:root{
  --room:#DCE8F1; --room-2:#EEF4F8;
  --ink:#2E3A4B; --ink-soft:#6B7A8C;
  --apricot:#E39A55; --apricot-deep:#C97A36;
  --blush:#F2B4B0; --milk:#FFFDFB; --glass:rgba(255,253,251,.82);
  --lock:#B7C3CF;
  --f-display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"Quicksand","Gowun Dodum",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:radial-gradient(120% 90% at 50% 0%,var(--room-2),var(--room));color:var(--ink);font-family:var(--f-body);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
#stage{flex:1 1 auto;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;touch-action:none}
#card{position:relative;border-radius:22px;overflow:hidden;background:var(--milk);container-type:size;
  box-shadow:0 18px 50px -18px rgba(46,58,75,.35),0 0 0 1px rgba(46,58,75,.06)}
canvas{display:block;width:100%;height:100%}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0;flex:0 0 auto}
.icon-btn svg{width:18px;height:18px}
#pauseBtn{position:absolute;top:8px;right:8px}
button:focus-visible{outline:3px solid var(--apricot);outline-offset:2px}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box;
  background:rgba(238,244,248,.6);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);overflow:auto}
.panel{display:flex;align-items:center;gap:clamp(12px,4cqw,40px);max-width:100%}
.copy{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero{flex:0 0 auto;width:min(40cqw,380px);filter:drop-shadow(0 14px 18px rgba(46,58,75,.22))}
.hero img{display:block;width:100%}
.eyebrow{font-family:var(--f-num);font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--apricot-deep);text-transform:uppercase;white-space:nowrap}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,8cqh,54px);line-height:1.05;margin:0;white-space:nowrap}
h1 em,h2 em{font-style:normal;color:var(--apricot)}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,6cqh,34px);margin:0;white-space:nowrap}
.modes{display:flex;flex-direction:column;gap:8px}
.mode{display:flex;align-items:center;gap:12px;border:0;cursor:pointer;text-align:left;background:var(--milk);color:var(--ink);
  border-radius:16px;padding:9px 16px 9px 10px;box-shadow:0 4px 0 rgba(46,58,75,.10);font-family:var(--f-body);transition:transform .12s}
.mode:hover{transform:translateY(-2px)}
.mode .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#FCEBDC;flex:0 0 auto}
.mode .ic svg{width:22px;height:22px}
.mode b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;white-space:nowrap}
.mode small{font-size:12px;color:var(--ink-soft);white-space:nowrap}
.mode.primary{background:var(--apricot);color:var(--milk);box-shadow:0 5px 0 var(--apricot-deep)}
.mode.primary .ic{background:rgba(255,255,255,.25)}
.mode.primary small{color:rgba(255,255,255,.85)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.meta{font-family:var(--f-num);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.meta b{color:var(--ink)}
.btn{border:0;cursor:pointer;font-family:var(--f-display);font-size:19px;color:var(--milk);background:var(--apricot);padding:10px 24px;border-radius:999px;white-space:nowrap;
  box-shadow:0 5px 0 var(--apricot-deep);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--apricot-deep)}
.btn.ghost{background:var(--milk);color:var(--ink);box-shadow:0 4px 0 rgba(46,58,75,.15)}
.btn.small{font-size:16px;padding:8px 18px}

/* stage select */
.stage-wrap{display:flex;flex-direction:column;gap:14px;width:100%;max-width:900px}
.stage-head{display:flex;align-items:center;gap:12px}
.stage-head h2{flex:1;min-width:0}
.stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.st{border:0;cursor:pointer;border-radius:18px;padding:0;overflow:hidden;background:var(--milk);text-align:left;color:var(--ink);font-family:var(--f-body);
  box-shadow:0 5px 0 rgba(46,58,75,.10);display:flex;flex-direction:column;transition:transform .12s;min-width:0}
.st:hover:not(:disabled){transform:translateY(-3px)}
.st canvas{width:100%;aspect-ratio:16/9;height:auto;display:block}
.st .in{padding:8px 10px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.st .n{font-family:var(--f-num);font-weight:700;font-size:11px;letter-spacing:.14em;color:var(--apricot-deep);white-space:nowrap}
.st b{font-family:var(--f-display);font-weight:400;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st .stars{font-size:14px;letter-spacing:2px;color:#F2B544;white-space:nowrap}
.st .stars i{font-style:normal;color:#D9E0E7}
.st:disabled{cursor:not-allowed}
.st:disabled canvas{filter:grayscale(.85) brightness(1.05);opacity:.55}
.st:disabled .n{color:var(--lock)}
.how{font-size:13px;color:var(--ink-soft);display:flex;gap:6px 16px;flex-wrap:wrap}
.how span{white-space:nowrap}
kbd{font-family:var(--f-num);font-weight:700;font-size:11px;padding:2px 6px;border-radius:6px;background:var(--milk);box-shadow:inset 0 -2px 0 rgba(46,58,75,.12);color:var(--ink)}

/* results */
.res{display:flex;align-items:center;gap:clamp(14px,4cqw,40px);max-width:100%}
.res .pic{flex:0 0 auto;width:min(26cqw,210px)}
.res .pic img{display:block;width:100%;filter:drop-shadow(0 10px 16px rgba(46,58,75,.25))}
.rank{display:flex;flex-direction:column;gap:4px;margin:2px 0 4px}
.rank div{display:flex;align-items:center;gap:10px;font-size:14px;white-space:nowrap;padding:4px 10px;border-radius:10px}
.rank div.me{background:#FCEBDC}
.rank .p{font-family:var(--f-num);font-weight:700;width:30px}
.rank .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.rank .nm{flex:1;min-width:0}
.rank .tm{font-family:var(--f-num);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.bigstars{font-size:30px;letter-spacing:4px;color:#F2B544;white-space:nowrap;line-height:1}
.bigstars i{font-style:normal;color:#D9E0E7}
.stat{font-family:var(--f-num);font-size:14px;color:var(--ink-soft);white-space:nowrap}
.stat b{color:var(--ink);font-size:18px}

@container (max-width:640px){ .hero{display:none} .stages{grid-template-columns:repeat(3,minmax(0,1fr))} .res .pic{display:none} }
@container (max-height:360px){ .hero{width:min(30cqw,260px)} .mode{padding:6px 14px 6px 8px} .mode small{display:none} .how{display:none} }
@media (max-aspect-ratio:1/1){
  .overlay{position:fixed;z-index:20;padding:20px max(16px,env(safe-area-inset-left,0px));background:rgba(232,240,246,.9)}
  .panel,.res{flex-direction:column;text-align:center}
  .copy{align-items:center} .row{justify-content:center}
  .hero{display:block;width:min(70vw,300px)} .res .pic{display:block;width:120px}
  .stages{grid-template-columns:repeat(2,minmax(0,1fr))}
  .how{display:none} .rank{align-self:stretch}
}

/* touch pad */
#pad{display:none;width:100%;max-width:760px;gap:10px;flex:0 0 auto}
.touch #pad.on{display:flex}
.grp{display:flex;gap:8px;flex:1;min-width:0}
.pad{flex:1;min-width:0;height:62px;border:0;border-radius:18px;background:var(--milk);color:var(--ink);font-family:var(--f-display);font-size:17px;
  display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 5px 0 rgba(46,58,75,.13);touch-action:none;white-space:nowrap}
.pad svg{width:18px;height:18px;flex:0 0 auto}
.pad.jump{background:var(--apricot);color:var(--milk);box-shadow:0 5px 0 var(--apricot-deep);flex:1.3}
.pad.item{background:#EAF2F8}
.pad.on{transform:translateY(3px);box-shadow:0 2px 0 rgba(46,58,75,.13)}
.pad.jump.on{box-shadow:0 2px 0 var(--apricot-deep)}
.grp.two .pad{height:56px;font-size:15px}
.grp.two .tag{font-family:var(--f-num);font-weight:700;font-size:12px;align-self:center;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){ .btn,.mode,.st{transition:none} }
</style>

<div id="app">
  <div id="stage">
    <div id="card">
      <canvas id="cv" aria-label="츄르먹는 루루 게임 화면"></canvas>
      <button class="icon-btn" id="pauseBtn" aria-label="일시정지" hidden>
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="5" y="4" width="3.5" height="12" rx="1.5" fill="currentColor"/><rect x="11.5" y="4" width="3.5" height="12" rx="1.5" fill="currentColor"/></svg>
      </button>

      <!-- title -->
      <div class="overlay" id="titleOv">
        <div class="panel">
          <div class="hero"><img id="heroImg" alt="책상 위에 식빵 자세로 앉은 루루"></div>
          <div class="copy">
            <div class="eyebrow">Luru's Churu Run</div>
            <h1>츄르먹는 <em>루루</em></h1>
            <div class="modes">
              <button class="mode primary" data-mode="race">
                <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h12l-2.5 4L17 12H5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span><b>고양이 레이스</b><small>세 마리 고양이와 아이템 경주</small></span></button>
              <button class="mode" data-mode="solo">
                <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="18" rx="2.5" fill="#F6D7C3" stroke="#E39A55" stroke-width="1.6" transform="rotate(-18 12 12)"/><rect x="9" y="9" width="6" height="4" fill="#E39A55" transform="rotate(-18 12 12)"/></svg></span>
                <span><b>혼자 달리기</b><small>하트 3개로 츄르 모으며 완주</small></span></button>
              <button class="mode" data-mode="duo">
                <span class="ic"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="9" r="3.2" fill="none" stroke="#E39A55" stroke-width="2"/><circle cx="16" cy="9" r="3.2" fill="none" stroke="#C9A23E" stroke-width="2"/><path d="M3 19c.8-3 2.6-4.5 5-4.5s4.2 1.5 5 4.5M11 19c.8-3 2.6-4.5 5-4.5s4.2 1.5 5 4.5" fill="none" stroke="#6B7A8C" stroke-width="1.8" stroke-linecap="round"/></svg></span>
                <span><b>둘이서 대결</b><small>한 화면을 위아래로 나눠 대결</small></span></button>
            </div>
            <div class="row">
              <button class="icon-btn" id="soundBtn" aria-label="소리 끄기"></button>
              <span class="meta">모은 별 <b id="starTotal">0</b> / 30</span>
            </div>
          </div>
        </div>
      </div>

      <!-- stage select -->
      <div class="overlay" id="stageOv" hidden>
        <div class="stage-wrap">
          <div class="stage-head">
            <button class="icon-btn" id="backBtn" aria-label="처음으로"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <h2 id="modeTitle">고양이 레이스</h2>
          </div>
          <div class="stages" id="stages"></div>
          <div class="how" id="how"></div>
        </div>
      </div>

      <!-- pause -->
      <div class="overlay" id="pauseOv" hidden>
        <div class="panel" style="flex-direction:column;text-align:center">
          <h2>잠깐 쉬는 중</h2>
          <div class="row" style="justify-content:center">
            <button class="btn" id="resumeBtn">계속 달리기</button>
            <button class="btn ghost" id="quitBtn">스테이지 선택</button>
          </div>
        </div>
      </div>

      <!-- result -->
      <div class="overlay" id="resOv" hidden>
        <div class="res">
          <div class="pic"><img id="resImg" alt=""></div>
          <div class="copy">
            <div class="eyebrow" id="resEyebrow">Stage 1</div>
            <h2 id="resTitle">클리어!</h2>
            <div class="bigstars" id="resStars"></div>
            <div class="rank" id="resRank"></div>
            <div class="row" id="resStats"></div>
            <div class="row">
              <button class="btn" id="nextBtn">다음 스테이지</button>
              <button class="btn ghost small" id="retryBtn">다시 하기</button>
              <button class="btn ghost small" id="selBtn">스테이지 선택</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="pad"></div>
</div>

<script>
(()=>{
/* =====================================================================
   1. CAT SKIN — photo parts. Future app: replace these with a user's own cut-outs.
   ===================================================================== */
const ASSET={body:"assets/body.webp",head:"assets/head.webp",tail:"assets/tail.webp",leg:"assets/leg.webp",hero:"assets/hero.webp",win:"assets/win.webp",sleep:"assets/sleep.webp",rus:"assets/rus.webp"};
// Luru = photo parts. Rivals = illustrated breeds, drawn into the same part sizes so one rig animates both.
const SKINS=[
  {id:'luru', name:'루루',   breed:'스코티시폴드', accent:'#E39A55', photo:true, neck:'#F4F0EC', legLen:20},
  {id:'blue', name:'블루',   breed:'러시안블루',   accent:'#7F90AA', legLen:21,
   fur:'#93A3B8', furTop:'#AAB8CA', belly:'#8494AA', paw:'#A3B1C4', eye:'#7CC67F', nose:'#6F7B8D', ear:'big'},
  {id:'somi', name:'솜이',   breed:'페르시안',     accent:'#D9C3A5', legLen:17, fluffy:true, flat:true,
   fur:'#F8F1E7', furTop:'#FFFBF5', belly:'#EADCC8', paw:'#FFF8F0', eye:'#DB8B3A', nose:'#E9A1A0', ear:'small'},
  {id:'eunbi',name:'은비',   breed:'아메리칸숏헤어',accent:'#8E959E', legLen:20, tabby:true,
   fur:'#D3D7DC', furTop:'#E3E6EA', belly:'#E9ECEF', paw:'#E7EAED', eye:'#A2C46A', nose:'#D9939A', ear:'mid', stripe:'#525A66'},
  {id:'jjal', name:'짤순이', breed:'먼치킨',       accent:'#D99A5B', legLen:12, calico:true,
   fur:'#FCF9F5', furTop:'#FFFFFF', belly:'#F3EEE8', paw:'#FFFFFF', eye:'#E3A43A', nose:'#EBA3A5', ear:'mid'},
];
const $=id=>document.getElementById(id);
$('heroImg').src=ASSET.hero;
let assetsReady=false;
function loadImg(src){return new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=src})}
function toCanvas(img){const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;c.getContext('2d').drawImage(img,0,0);return c}
function darken(c,amt){const o=document.createElement('canvas');o.width=c.width;o.height=c.height;const g=o.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-atop';g.fillStyle=`rgba(60,50,70,${amt})`;g.fillRect(0,0,o.width,o.height);return o}
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')]}
function blob(g,x,y,rx,ry,rot){g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill()}
/* --- illustrated parts (sizes match the photo parts: body 300x189, head 150x137, tail 90x154, leg 48x106) --- */
function drawBody(s){
  const [c,g]=cnv(300,189);
  const path=()=>{g.beginPath();g.ellipse(148,98,138,62,0,0,7);g.ellipse(232,96,62,60,0,0,7)};
  if(s.fluffy){g.fillStyle=s.fur;for(let a=0;a<64;a++){const t=a/64*Math.PI*2;blob(g,148+Math.cos(t)*136,98+Math.sin(t)*60,14,12)}}
  path(); const gr=g.createLinearGradient(0,30,0,165); gr.addColorStop(0,s.furTop); gr.addColorStop(.6,s.fur); gr.addColorStop(1,s.belly); g.fillStyle=gr; g.fill();
  g.save(); path(); g.clip();
  if(s.tabby){ g.strokeStyle=s.stripe; g.lineCap='round';
    g.lineWidth=13; g.beginPath(); g.ellipse(120,98,42,30,0,0,7); g.stroke(); g.lineWidth=11; g.beginPath(); g.ellipse(120,98,14,10,0,0,7); g.stroke();
    g.lineWidth=10; for(const x of [40,190,225,258]){g.beginPath();g.moveTo(x,36);g.quadraticCurveTo(x+14,80,x-4,128);g.stroke()}
    g.lineWidth=8; g.beginPath(); g.moveTo(30,52); g.quadraticCurveTo(150,20,270,46); g.stroke() }
  if(s.calico){ g.fillStyle='#E9A25E'; blob(g,95,70,62,42,-.2); blob(g,215,58,34,24,.3); g.fillStyle='#4A4550'; blob(g,150,62,34,26,.2); blob(g,40,105,26,30,0) }
  if(!s.tabby&&!s.calico){ g.strokeStyle='rgba(255,255,255,.18)'; g.lineWidth=3; for(let k=0;k<9;k++){g.beginPath();g.moveTo(40+k*26,60+(k%3)*12);g.quadraticCurveTo(50+k*26,80,44+k*26,100);g.stroke()} }
  g.fillStyle='rgba(255,255,255,.18)'; blob(g,150,52,90,14,0);
  g.restore(); return c;
}
function drawHead(s){
  const [c,g]=cnv(150,137); const cx=75, cy=78;
  const ear=(sx)=>{ const big=s.ear==='big'?1.2:s.ear==='small'?.7:1;
    g.fillStyle=s.calico?(sx<0?'#E9A25E':'#4A4550'):s.tabby?'#9CA3AC':s.fur; g.beginPath(); g.moveTo(cx+sx*18,cy-40); g.lineTo(cx+sx*(46+6*big),cy-40-44*big); g.lineTo(cx+sx*58,cy-18); g.closePath(); g.fill();
    g.fillStyle='#E8B4B8'; g.beginPath(); g.moveTo(cx+sx*28,cy-36); g.lineTo(cx+sx*(46+4*big),cy-34-30*big); g.lineTo(cx+sx*51,cy-22); g.closePath(); g.fill() };
  ear(-1); ear(1);
  if(s.fluffy){g.fillStyle=s.fur;for(let a=0;a<40;a++){const t=a/40*Math.PI*2;blob(g,cx+Math.cos(t)*60,cy+Math.sin(t)*50,11,10)}}
  const gr=g.createRadialGradient(cx,cy-20,10,cx,cy,66); gr.addColorStop(0,s.furTop); gr.addColorStop(1,s.fur); g.fillStyle=gr; blob(g,cx,cy,62,52);
  g.save(); g.beginPath(); g.ellipse(cx,cy,62,52,0,0,7); g.clip();

const OBS={
  cucumber:{w:52,h:24}, vacuum:{w:64,h:24}, pot:{w:40,h:52}, rock:{w:50,h:30}, box:{w:46,h:44}, crate:{w:62,h:30},

function buildCourse(si,mode){
  const S=STAGES[si], R=rng(1234+si*77+(mode==='solo'?5:0));
  const base=S.base*SPD, len=Math.round(base*240);
  const C={len,obs:[],items:[],traps:[],shots:[],churuTotal:0};
  const pick=a=>a[(R()*a.length)|0];
  const addOb=(type,x)=>{const d=OBS[type];const o={id:C.obs.length,type,x,w:d.w,h:d.h||0,high:d.high||null,seed:R()*6,hit:{}};C.obs.push(o);return o};
  const addC=(x,y,kind='churu')=>{C.items.push({kind,x,y,seed:R()*6,hue:(R()*3)|0,got:{}});if(kind==='churu')C.churuTotal++};
  const arc=(cx,peak,n,span)=>{for(let i=0;i<n;i++){const u=i/(n-1)*2-1;addC(cx+u*span/2,GROUND-36-peak*(1-u*u))}};
  const line=(x,y,n,gap=44)=>{for(let i=0;i<n;i++)addC(x+i*gap,y)};
  const boxes=x=>{C.items.push({kind:'box',x,y:GROUND-40,seed:R()*6,respawn:0});C.items.push({kind:'box',x:x+10,y:GROUND-150,seed:R()*6,respawn:0})};
  let x=900, n=0;
  const boxEvery=mode==='solo'?6:3;
  while(x<len-700){
    n++;
    if(n%boxEvery===0){ boxes(x); line(x+120,GROUND-30,3); x+=380; continue }
    const r=R(), lo=pick(S.low), hi=pick(S.high);
    if(r<.24){const o=addOb(lo,x);arc(x+o.w/2,o.h>40?150:125,5,o.h>40?250:230);x+=o.w}
    else if(r<.42){const o=addOb(hi,x);line(x-30,GROUND-26,4,40);x+=o.w}
    else if(r<.56){addOb(lo,x);const o=addOb(pick(S.low),x+250+S.dens*60);arc(x+26,120,4,170);line(x+o.x-x+60,GROUND-30,2);x+=o.x-x+o.w}
    else if(r<.68){addOb(lo,x);const o=addOb(hi,x+300);arc(x+24,130,4,180);line(x+290,GROUND-26,3,40);x+=300+o.w}
    else if(r<.80){for(let i=0;i<7;i++)addC(x+i*44,GROUND-60-Math.sin(i/6*Math.PI)*70);x+=300}
    else if(r<.90){addOb(lo,x);line(x-30,GROUND-232,5,42);x+=OBS[lo].w}
    else {const o=addOb(hi,x);addOb(lo,x+o.w+190+S.dens*80);line(x-20,GROUND-26,3,40);x+=o.w+260}
    if(mode==='solo'){ if(R()<.07) addC(x+180,GROUND-150,'gold'); else if(R()<.05) addC(x+180,GROUND-110,'heart') }
    x+=base*(1.05+R()*.5)*(1.18-S.dens);
  }
  C.obs.sort((a,b)=>a.x-b.x); C.items.sort((a,b)=>a.x-b.x);
  return C;
}

function hitbox(r){return (r.slide>0&&r.ground)?{l:r.x-38,r:r.x+50,t:r.y-50,b:r.y-2}:{l:r.x-30,r:r.x+42,t:r.y-86,b:r.y-4}}
function obBox(o,t){
  const x=o.x+(o.type==='crab'?Math.sin(t*1.6+o.seed)*34:0);
  if(o.high==='hang') return {l:x+6,r:x+o.w-6,t:0,b:GROUND-70};
  if(o.high==='fly') return {l:x+4,r:x+o.w-4,t:GROUND-126,b:GROUND-70};
  return {l:x+5,r:x+o.w-5,t:GROUND-o.h+4,b:GROUND};
}
const overlap=(a,b)=>a.l<b.r&&a.r>b.l&&a.t<b.b&&a.b>b.t;

function rubber(r){
  const lead=Math.max(...G.humans.map(h=>h.x)), d=r.x-lead;
  if(d<-1400) return 1.2; if(d<-700) return 1.12; if(d<-300) return 1.05; if(d>1400) return .88; if(d>700) return .94; return 1;

function aiThink(r,dt){
  if(r.finished||r.dead) return;
  if(r.rus>0){ let best=null,bd=1e9; for(const d of G.rain){ if(d.owner!==r.i||d.got||d.x<r.x) continue; const dd=d.x-r.x; if(dd<bd){bd=dd;best=d} } if(best) r.flyY=clamp(best.y+60+(best.vy*(bd/Math.max(300,r.v))),GROUND-190,GROUND-20); return }

  for(const o of G.C.obs){
    if(o.x>r.x+v*.6+60) break;
    if(o.x+o.w<r.x) continue;
    const key=o.id;
    if(!a.seen.has(key)){a.seen.add(key); o['ok'+r.i]=Math.random()<a.skill}
    if(!o['ok'+r.i]) continue;
    const front=obBox(o,G.t).l - (r.x+44);
    if(!o.high){ if(front<v*.13+14&&front>-10&&r.ground) jump(r) }
    else { if(front<v*.12+24&&front>-o.w) { if(r.ground) slide(r,(o.w+110)/v) } }
  }
  for(const tp of G.C.traps){ if(tp.dead||tp.owner===r.i) continue; const f=tp.x-(r.x+40); if(f>0&&f<v*.14+10&&r.ground&&Math.random()<a.skill) jump(r) }

}
function updateShots(dt){
  const C=G.C;

    s.life-=dt;

      const tg=G.racers[s.target];
      s.x+=(tg?Math.max(tg.v,300)+420:800)*dt; s.spin+=dt*14;
      if(tg&&!tg.finished&&Math.abs(s.x-tg.x)<30){ if(tg.y>GROUND-34){ if(hitRacer(tg,1.2,'ball')){pop(tg.x,tg.y-100,'털뭉치!','#C97A36')} s.life=0 } }
      for(const tp of C.traps){ if(!tp.dead&&Math.abs(tp.x-s.x)<20){tp.dead=true;s.life=0;sparkle(s.x,GROUND-10,6,'#9BD394')} }
    }else if(s.k==='laser'){
      s.t+=dt; const tg=G.racers[s.target];
      if(s.life<=0&&tg){ if(hitRacer(tg,1.6,'laser')){pop(tg.x,tg.y-110,'레이저에 홀렸다!','#E05A5A');tg.vy=-300;tg.ground=false} }
    }
  }

  for(const tp of C.traps) tp.age+=dt;

function updatePlaces(){
  const order=[...G.racers].sort((a,b)=>{
    if(a.finished&&b.finished) return a.finishT-b.finishT;
    if(a.finished) return -1; if(b.finished) return 1; return b.x-a.x});

function update(dt){
  if(G.phase==='count'){
    G.count-=dt; const c=Math.ceil(G.count);
    if(c!==G.lastBeep&&c<=3&&c>=1){G.lastBeep=c;SFX.count(false)}
    if(G.count<=0){G.phase='run';SFX.count(true);G.goT=.8;for(const r of G.racers)r.v=G.base*.5}
    for(const r of G.racers) r.phase+=dt*2;
    return;
  }
  if(G.phase==='end') {G.endT+=dt}
  G.t+=dt; if(G.goT>0)G.goT-=dt;
  for(const r of G.racers){ if(r.ai||(r.human&&window.__luruAuto)) { if(!r.ai) r.ai={skill:.97,mul:1,useIn:1,seen:new Set(),auto:1}; aiThink(r,dt) } updateRacer(r,dt) }

  for(const r of G.racers){ if(r.rus>0&&r.human){ r.rainT-=dt; while(r.rainT<=0){ r.rainT+=.045; G.rain.push({x:r.x-PX+Math.random()*(W+240),y:-30-Math.random()*80,vy:180+Math.random()*220,owner:r.i,hue:(Math.random()*3)|0,seed:Math.random()*6,got:false}) } } }
  for(const d of G.rain){ d.y+=d.vy*dt; const r=G.racers[d.owner]; if(d.got) continue; const hb=hitbox(r);
    if(d.x>hb.l-26&&d.x<hb.r+26&&d.y>hb.t-26&&d.y<hb.b+20){ d.got=true; r.churu++; r.coins=Math.min(10,r.coins+1); if(Math.random()<.5) SFX.churu(r.churu); G.parts.push({k:'rb',x:d.x,y:d.y,vx:-120,vy:-40,life:.5,t:0,r:5,h:Math.random()*360}) } }
  G.rain=G.rain.filter(d=>!d.got&&d.y<GROUND+20&&d.x>G.racers[d.owner].x-PX-60);
  if(G.banner){G.banner.t+=dt; if(G.banner.t>2.2) G.banner=null}
  updateShots(dt); updatePlaces();
  for(const o of G.C.obs) if(o.knock) o.knock+=dt;
  for(const q of G.parts){q.t+=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.k==='spark'){q.vx*=.92;q.vy*=.92}if(q.k==='heart')q.vy+=60*dt;if(q.k==='coin')q.vy+=900*dt;if(q.k==='rb'){q.vx*=.96;q.vy*=.96}}
  G.parts=G.parts.filter(q=>q.t<q.life);
  for(const q of G.pops) q.t+=dt; G.pops=G.pops.filter(q=>q.t<1);
  if(G.shake>0)G.shake-=dt; if(G.flash>0)G.flash-=dt;
  if(G.phase==='run'&&G.humans.every(h=>h.finished||h.dead)){G.phase='end';G.endT=0}
  if(G.phase==='end'&&G.endT>1.6) endRace();
}

  c.save(); c.translate(x,y+Math.sin(t*4+seed)*3); c.rotate(-.35+Math.sin(t*3+seed)*.12);
  if(gold){c.shadowColor='rgba(255,205,90,.95)';c.shadowBlur=16}
  const [bg,band]=gold?['#FFE08A','#E8A92B']:CHURU_COL[hue];
  c.fillStyle=bg; rr(c,-6,-16,12,32,4); c.fill(); c.shadowBlur=0; c.fillStyle=band; c.fillRect(-6,-4,12,9); c.fillStyle='#fff'; c.beginPath(); c.arc(0,.5,2.4,0,7); c.fill();
  c.fillStyle=band; for(let i=0;i<4;i++){c.beginPath();c.moveTo(-6+i*3,-16);c.lineTo(-4.5+i*3,-19);c.lineTo(-3+i*3,-16);c.fill()}
  c.fillStyle='rgba(255,255,255,.55)'; c.fillRect(-4,-13,2,26); c.restore();
}
function drawBox(c,x,y,t,seed){
  const b=Math.sin(t*3+seed)*3; c.save(); c.translate(x,y+b); c.rotate(Math.sin(t*2+seed)*.08);
  c.shadowColor='rgba(185,166,232,.8)'; c.shadowBlur=12; const g=c.createLinearGradient(-15,-15,15,15); g.addColorStop(0,'#D8CBF5'); g.addColorStop(1,'#B9A6E8'); c.fillStyle=g; rr(c,-15,-15,30,30,7); c.fill(); c.shadowBlur=0;
  c.fillStyle='#F6D98B'; c.fillRect(-3,-15,6,30); c.fillRect(-15,-3,30,6); c.fillStyle='#FFFDFB'; c.font='bold 15px '+FONT_NUM; c.textAlign='center'; c.textBaseline='middle'; c.fillText('?',0,1); c.textBaseline='alphabetic'; c.restore();
}
function drawItemIcon(c,k,x,y,s){
  c.save(); c.translate(x,y); c.scale(s,s);
  if(k==='boost'){ c.strokeStyle='#8A6A4A'; c.lineWidth=3; c.lineCap='round'; c.beginPath(); c.moveTo(-10,10); c.lineTo(10,-10); c.stroke(); c.fillStyle='#6FB38E'; for(const [px,py,a] of [[-4,4,-.8],[3,-3,-.8],[0,-1,.8],[6,-7,.8]]){c.save();c.translate(px,py);c.rotate(a);c.beginPath();c.ellipse(0,-5,3,6,0,0,7);c.fill();c.restore()} c.fillStyle='#F6D06B'; star(c,9,7,5) }
  else if(k==='ball'){ c.fillStyle='#F3D9C6'; c.beginPath(); c.arc(0,0,11,0,7); c.fill(); c.strokeStyle='#E3A98A'; c.lineWidth=1.6; for(let i=0;i<4;i++){c.beginPath();c.arc(0,0,11-i*0,i*.8,i*.8+2);c.stroke()} c.beginPath(); c.moveTo(-8,-4); c.quadraticCurveTo(0,4,9,-6); c.moveTo(-9,4); c.quadraticCurveTo(0,-2,8,7); c.stroke() }
  else if(k==='trap'){ c.rotate(-.5); c.fillStyle='#7DBF7A'; rr(c,-14,-6,28,12,6); c.fill(); c.fillStyle='#E9F2C9'; c.beginPath(); c.ellipse(13,0,2,5,0,0,7); c.fill(); c.fillStyle='#5FA25E'; for(let i=0;i<4;i++){c.beginPath();c.arc(-8+i*5,(i%2)*3-1,1.2,0,7);c.fill()} }
  else if(k==='shield'){ c.fillStyle='#BFD8EE'; rr(c,-12,-10,24,20,8); c.fill(); c.fillStyle='#A6C6E4'; c.beginPath(); c.arc(-12,-10,3,0,7); c.arc(12,-10,3,0,7); c.arc(-12,10,3,0,7); c.arc(12,10,3,0,7); c.fill(); c.fillStyle='#fff'; heartPath(c,0,1,.55); c.fill() }
  else if(k==='laser'){ c.fillStyle='#5E6B80'; c.save(); c.rotate(-.6); rr(c,-12,-4,18,8,3); c.fill(); c.restore(); c.strokeStyle='rgba(240,80,80,.8)'; c.lineWidth=2; c.beginPath(); c.moveTo(3,-4); c.lineTo(11,-11); c.stroke(); c.fillStyle='#F05050'; c.beginPath(); c.arc(11,-11,3.5,0,7); c.fill() }
  else if(k==='magnet'){ c.strokeStyle='#E05A5A'; c.lineWidth=7; c.beginPath(); c.arc(0,-1,8,Math.PI,0,false); c.stroke(); c.fillStyle='#E05A5A'; c.fillRect(-11.5,-1,7,9); c.fillRect(4.5,-1,7,9); c.fillStyle='#E9EEF3'; c.fillRect(-11.5,5,7,4); c.fillRect(4.5,5,7,4) }
  c.restore();
}

/* ---------- Luru puppet rig (photo parts) ---------- */
function drawWing(c,x,y,flap,front){
  c.save(); c.translate(x,y); c.rotate(.55+flap*.5); if(!front) c.globalAlpha*=.7;
  for(let k=0;k<5;k++){ const len=72-k*9; c.save(); c.rotate(k*.24); const g=c.createLinearGradient(0,0,-len,0); g.addColorStop(0,'#FFFFFF'); g.addColorStop(.55,'#FFFFFF'); g.addColorStop(1,RAINBOW[(k*2+1)%7]); c.fillStyle=g; c.beginPath(); c.ellipse(-len/2,0,len/2,11-k*.8,0,0,7); c.fill(); c.strokeStyle='rgba(200,190,230,.5)'; c.lineWidth=1; c.stroke(); c.restore() }
  c.restore();
}
function drawCat(c,r,x,y,t,alpha,sc){
  const S=SKINS[r.skin]; if(!S.body) return;
  const sliding=r.slide>0&&r.ground, air=!r.ground, stun=r.stun>0;
  c.save(); c.globalAlpha=alpha;
  const lift=Math.max(0,GROUND-y); c.fillStyle=`rgba(46,58,75,${.16*Math.max(.25,1-lift/220)})`; c.beginPath(); c.ellipse(x+4,GROUND+2,46*sc*Math.max(.5,1-lift/300),5,0,0,7); c.fill();
  c.translate(x,y); c.scale(sc*(1+r.squash*.5),sc*(1-r.squash*.5));
  if(stun) c.rotate(Math.sin(t*28)*.07);
  if(r.boost>0||r.fever>0){const a=.3+.15*Math.sin(t*14),gr=c.createRadialGradient(0,-50,10,0,-50,85);gr.addColorStop(0,r.fever>0?`rgba(255,214,120,${a})`:`rgba(155,211,148,${a})`);gr.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=gr;c.beginPath();c.arc(0,-50,85,0,7);c.fill()}
  if(r.rus>0){
    const gr=c.createRadialGradient(0,-48,8,0,-48,100); gr.addColorStop(0,'rgba(255,255,255,.6)'); gr.addColorStop(.55,`hsla(${(t*220)%360},90%,80%,.35)`); gr.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=gr; c.beginPath(); c.arc(0,-48,100,0,7); c.fill();
    const flap=Math.sin(t*16), L=S.legLen, bTop=-L-46, pa=Math.sin(t*14)*.55;
    drawWing(c,-4,-58,flap,false);
    c.save(); c.translate(0,-44); c.scale(1,-1); c.translate(0,44);
    c.save(); c.translate(-48,bTop+24); c.rotate(2.55+Math.sin(t*9)*.35); c.drawImage(S.tail,-11,-3,22,38); c.restore();
    const lg=(img,lx,a)=>{c.save();c.translate(lx,-L);c.rotate(a);c.drawImage(img,-8,-6,16,L+6);c.restore()};
    lg(S.legFar,-24,-pa); lg(S.legFar,26,pa);
    c.drawImage(S.body,-56,bTop,104,65);
    if(S.neck){c.fillStyle=S.neck; c.beginPath(); c.ellipse(28,bTop+33,17,11,0,0,7); c.fill()}
    lg(S.leg,-34,pa); lg(S.leg,18,-pa);
    c.restore();
    drawWing(c,6,-62,Math.sin(t*16+.4),true);
    const H=S.rusHead, hw=64;
    if(H){ const hh=hw*H.height/H.width; c.save(); c.translate(40,-30); c.rotate(Math.sin(t*5)*.05); c.drawImage(H,-hw/2,-hh/2,hw,hh); c.restore() }
    else { const hh=58*S.head.height/S.head.width; c.save(); c.translate(40,-30); c.rotate(Math.PI); c.drawImage(S.head,-29,-hh/2,58,hh); c.restore() }
    c.restore(); return;
  }
  const ph=r.phase, run=!air&&!sliding&&!stun&&G&&G.phase!=='count';
  const bob=run?-Math.abs(Math.sin(ph))*3:0;
  const L=S.legLen, bTop=-L-46+bob;            // short legs: body sits just above the paws
  const hw=58, hh=hw*S.head.height/S.head.width;
  const tailA=2.35+Math.sin(ph*.5)*.22+(air?-.35:0)+(sliding?.6:0);
  c.save(); c.translate(-48,sliding?-30:bTop+24); c.rotate(tailA); c.drawImage(S.tail,-11,-3,22,38); c.restore();
  const leg=(img,lx,a,py)=>{c.save();c.translate(lx,py);c.rotate(a);c.drawImage(img,-8,-6,16,L+6);c.restore()};
  const sw=run?.7:0;
  if(sliding){
    c.drawImage(S.body,-60,-50,110,46);
    if(S.neck){c.fillStyle=S.neck; c.beginPath(); c.ellipse(32,-30,18,15,0,0,7); c.fill()}
    leg(S.leg,30,-1.4,-14); leg(S.leg,-34,1.4,-14);
    c.drawImage(S.head,20,-62,hw*.9,hh*.9);
  }else{
    const fa=air?-.8:0, ba=air?.8:0, py=-L+bob*.3;
    leg(S.legFar,-24,ba+Math.sin(ph+Math.PI)*sw,py); leg(S.legFar,26,fa+Math.sin(ph)*sw,py);
    c.drawImage(S.body,-56,bTop,104,65);
    if(S.neck){c.fillStyle=S.neck; c.beginPath(); c.ellipse(28,bTop+33,17,11,0,0,7); c.fill()}
    leg(S.leg,-34,ba+Math.sin(ph)*sw,py); leg(S.leg,18,fa+Math.sin(ph+Math.PI)*sw,py);
    c.save(); c.translate(36,bTop+6+bob*.3); c.rotate(air?-.08:Math.sin(ph*.5)*.03); c.drawImage(S.head,-hw/2,-hh/2,hw,hh); c.restore();
  }
  if(stun){c.fillStyle='#F6D06B';for(let k=0;k<3;k++){const a=t*6+k*2.1;star(c,40+Math.cos(a)*26,-104+Math.sin(a)*7,5)}}
  c.restore();
  if(r.shield>0){c.save();c.globalAlpha=.55+.15*Math.sin(t*6);c.strokeStyle='#8DB8E4';c.lineWidth=3;c.beginPath();c.ellipse(x+4,y-48*sc,64*sc,58*sc,0,0,7);c.stroke();c.globalAlpha=.12;c.fillStyle='#BFD8EE';c.fill();c.restore()}
}

/* =====================================================================
   11. RENDER
   ===================================================================== */
function renderView(vi,focus,t){
  const S=STAGES[G.stage], cam=focus.x-PX;
  ctx.save(); ctx.translate(0,vi*VH); ctx.beginPath(); ctx.rect(0,0,W,VH); ctx.clip();
  if(G.shake>0&&!reduced&&focus.human) ctx.translate((Math.random()-.5)*G.shake*24,(Math.random()-.5)*G.shake*24);
  drawBG(ctx,S,cam);
  // start + finish lines
  const sx0=0-cam, fx=G.C.len-cam;
  if(sx0>-60&&sx0<W+60){ctx.fillStyle='rgba(255,255,255,.75)';ctx.fillRect(sx0+40,GROUND-2,6,40)}
  if(fx>-120&&fx<W+120){
    ctx.fillStyle='#FFFDFB'; ctx.fillRect(fx-4,GROUND-200,8,200); ctx.fillRect(fx+116,GROUND-200,8,200);
    ctx.fillStyle='#E39A55'; rr(ctx,fx-14,GROUND-224,148,34,10); ctx.fill(); ctx.fillStyle='#FFFDFB'; ctx.font='20px '+FONT_DISP; ctx.textAlign='center'; ctx.fillText('GOAL',fx+60,GROUND-200);
    for(let i=0;i<10;i++) for(let j=0;j<2;j++){ctx.fillStyle=(i+j)%2?'#2E3A4B':'#FFFDFB';ctx.fillRect(fx+i*12,GROUND+6+j*8,12,8)}
  }
  // traps
  for(const tp of G.C.traps){const x=tp.x-cam;if(x<-60||x>W+60)continue;ctx.save();ctx.translate(x,GROUND-8);drawItemIcon(ctx,'trap',0,0,1.4);ctx.restore()}
  // obstacles
  for(const o of G.C.obs){const x=o.x-cam; if(x<-160||x>W+160) continue;
    if(o.knock){const k=o.knock,cx=x+o.w/2,cy=GROUND-(o.h||30)/2;ctx.save();ctx.globalAlpha=Math.max(0,1-k);ctx.translate(cx+k*140,cy-k*180+k*k*160);ctx.rotate(k*7);ctx.translate(-cx,-cy);drawOb(ctx,o,x,t);ctx.restore()}
    else drawOb(ctx,o,x,t)}
  // items
  for(const it of G.C.items){const x=it.x-cam; if(x<-40||x>W+40) continue;
    if(it.kind==='box'){ if(it.respawn<=0) drawBox(ctx,x,it.y,t,it.seed); else if(it.respawn<.4){ctx.globalAlpha=1-it.respawn/.4;drawBox(ctx,x,it.y,t,it.seed);ctx.globalAlpha=1} continue }
    if(it.got[focus.i]) continue;
    if(it.kind==='heart'){ctx.save();ctx.shadowColor='rgba(242,163,160,.8)';ctx.shadowBlur=12;ctx.fillStyle='#F2A3A0';heartPath(ctx,x,it.y+Math.sin(t*4)*3,1.1);ctx.fill();ctx.restore()}
    else drawChuru(ctx,x,it.y,it.hue,it.kind==='gold',t,it.seed)}
  // racers: others first, focus last
  const others=G.racers.filter(r=>r!==focus);
  for(const r of others){ const x=r.x-cam; if(x<-120||x>W+120) continue;
    const blink=r.inv>0&&r.stun<=0&&((r.inv*12)|0)%2===0;
    drawRacer(r,x,t,blink?.4:.96,.9);
    nameTag(r,x,r.y-112*.9,false) }
  for(const d of G.rain){ if(d.owner!==focus.i||d.got) continue; const x=d.x-cam; if(x<-20||x>W+20) continue; drawChuru(ctx,x,d.y,d.hue,false,t,d.seed) }
  { const r=focus, x=PX, blink=r.inv>0&&r.stun<=0&&((r.inv*12)|0)%2===0; drawRacer(r,x,t,blink?.4:1,1); if(G.mode!=='solo'&&r.rus<=0) nameTag(r,x,r.y-118,true) }
  // shots
  for(const s of G.C.shots){
    if(s.k==='ball'){const x=s.x-cam; if(x<-30||x>W+30) continue; ctx.save(); ctx.translate(x,s.y); ctx.rotate(s.spin); drawItemIcon(ctx,'ball',0,0,1); ctx.restore()}
    else { const tg=G.racers[s.target]; const tx=tg.x-cam; const p=Math.min(1,s.t/1.3); const sx=lerp(W+40,tx+30,p), sy=lerp(30,tg.y-60,p);
      ctx.fillStyle='rgba(240,80,80,.25)'; ctx.beginPath(); ctx.arc(sx,sy,14,0,7); ctx.fill(); ctx.fillStyle='#F05050'; ctx.beginPath(); ctx.arc(sx,sy,6,0,7); ctx.fill() }
  }
  // particles
  for(const q of G.parts){const x=q.x-cam, a=1-q.t/q.life; if(x<-20||x>W+20) continue; ctx.globalAlpha=a;
    if(q.k==='dust'){ctx.fillStyle=S.night?'rgba(200,210,235,.6)':'rgba(255,255,255,.95)';ctx.beginPath();ctx.arc(x,q.y,q.r*(1+q.t*2),0,7);ctx.fill()}
    else if(q.k==='spark'){ctx.fillStyle=q.col||'#fff';star(ctx,x,q.y,q.r)}
    else if(q.k==='heart'){ctx.fillStyle='#F2A3A0';heartPath(ctx,x,q.y,q.r/8);ctx.fill()}
    else if(q.k==='coin'){drawChuru(ctx,x,q.y,2,false,0,0)}
    else if(q.k==='fly'){const p=q.t/q.life;drawChuru(ctx,lerp(x,q.tx.x+10-cam,p),lerp(q.y,q.tx.y-50,p),q.hue,false,0,0)}
    else if(q.k==='ring'){ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(x,q.y+30,q.r+q.t*90,(q.r+q.t*90)*.3,0,0,7);ctx.stroke()}}
  ctx.globalAlpha=1;
  ctx.textAlign='center'; ctx.font='700 16px '+FONT_NUM;
  for(const q of G.pops){const a=1-q.t; ctx.globalAlpha=a; const x=q.x-cam, y=q.y-q.t*40; ctx.font='18px '+FONT_DISP; ctx.lineWidth=4; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.strokeText(q.txt,x,y); ctx.fillStyle=q.col; ctx.fillText(q.txt,x,y)} ctx.globalAlpha=1;
  if(focus.rus>0||G.rusAny){
    const I=focus.rus>0?1:.5; ctx.save(); ctx.strokeStyle='#FFFFFF'; ctx.lineCap='round';
    for(let i=0;i<24;i++){ const y=(i*53.7+(i*i*7)%41)%(VH-30)+10, len=60+(i*37)%160, sp=1700+(i%5)*350, x=W+200-((t*sp+i*211)%(W+460));
      ctx.globalAlpha=(.25+.35*((i%3)/2))*I; ctx.lineWidth=1.5+(i%3); ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+len,y); ctx.stroke() }
    if(focus.rus>0&&!reduced){ const cx=PX+20, cy=focus.y-45, RR=W+VH; ctx.fillStyle='rgba(255,255,255,.6)'; ctx.globalAlpha=1;
      for(let i=0;i<64;i++){ const a=i/64*Math.PI*2+Math.random()*.06, r0=165+Math.random()*110, w=.006+Math.random()*.014;
        ctx.beginPath(); ctx.moveTo(cx+Math.cos(a-w)*RR,cy+Math.sin(a-w)*RR); ctx.lineTo(cx+Math.cos(a+w)*RR,cy+Math.sin(a+w)*RR); ctx.lineTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0); ctx.fill() }
      const vg=ctx.createRadialGradient(cx,cy,140,cx,cy,W*.75); vg.addColorStop(0,'rgba(255,255,255,0)'); vg.addColorStop(1,`hsla(${(t*120)%360},90%,85%,.35)`); ctx.fillStyle=vg; ctx.fillRect(0,0,W,VH) }
    ctx.restore();
  }
  for(const q of G.parts){ if(q.k!=='rb') continue; const x=q.x-cam; if(x<-20||x>W+20) continue; ctx.globalAlpha=1-q.t/q.life; ctx.fillStyle=`hsl(${(q.h+q.t*200)%360},92%,74%)`; star(ctx,x,q.y,q.r*(1-q.t/q.life*.5)) } ctx.globalAlpha=1;
  // edge markers for off-screen racers
  if(G.mode!=='solo') for(const r of others){ const x=r.x-cam; if(x>W+10||x<-60){ const right=x>W; const d=Math.round(Math.abs(r.x-focus.x)/40);
      const ex=right?W-18:18, ey=GROUND-150; ctx.fillStyle='rgba(255,253,251,.88)'; rr(ctx,right?ex-74:ex-8,ey-14,82,28,14); ctx.fill();
      if(SKINS[r.skin].face) ctx.drawImage(SKINS[r.skin].face,right?ex-70:ex-4,ey-11,22,22);
      ctx.fillStyle='#2E3A4B'; ctx.font='700 12px '+FONT_NUM; ctx.textAlign='left'; ctx.fillText((right?'+':'-')+d+'m',right?ex-44:ex+22,ey+4);
      ctx.fillStyle=SKINS[r.skin].accent; ctx.beginPath(); if(right){ctx.moveTo(ex+2,ey-6);ctx.lineTo(ex+10,ey);ctx.lineTo(ex+2,ey+6)}else{ctx.moveTo(ex-10,ey-6);ctx.lineTo(ex-18,ey);ctx.lineTo(ex-10,ey+6)} ctx.fill() } }
  if(G.mode==='solo'&&focus.fever>0){ctx.fillStyle=`rgba(255,214,120,${.08+.04*Math.sin(t*6)})`;ctx.fillRect(0,0,W,VH)}
  drawHUD(focus,vi,t);
  if(G.banner&&(G.mode!=='duo'||G.banner.i===focus.i)){
    const bt=G.banner.t, sc2=bt<.2?bt/.2*1.35:1+.35*Math.max(0,1-(bt-.2)/.3), al=bt>1.8?Math.max(0,1-(bt-1.8)/.4):1;
    const fs=Math.min(48,W/10.5), txt='루성태 모드 돌입!!';
    ctx.save(); ctx.globalAlpha=al; ctx.translate(W/2,VH*.4); ctx.scale(sc2,sc2); ctx.rotate(Math.sin(bt*9)*.035);
    ctx.font=fs+'px '+FONT_DISP; ctx.textAlign='center'; const tw=ctx.measureText(txt).width;
    for(let k=0;k<10;k++){const a=k/10*Math.PI*2+bt*2;ctx.fillStyle=RAINBOW[k%7];star(ctx,Math.cos(a)*(tw*.62),Math.sin(a)*fs*.95,6+3*Math.sin(bt*10+k))}
    const g=ctx.createLinearGradient(-tw/2,0,tw/2,0); RAINBOW.forEach((c2,k)=>g.addColorStop(((k/6)+bt*.6)%1,c2));
    ctx.lineJoin='round'; ctx.lineWidth=fs*.28; ctx.strokeStyle='#FFFFFF'; ctx.strokeText(txt,0,fs*.35);
    ctx.lineWidth=fs*.08; ctx.strokeStyle='#8C6BC8'; ctx.strokeText(txt,0,fs*.35);
    ctx.fillStyle=g; ctx.fillText(txt,0,fs*.35); ctx.restore();
  }
  if(G.flash>0&&focus.human){ctx.fillStyle=`rgba(255,255,255,${G.flash*1.5})`;ctx.fillRect(0,0,W,VH)}
  ctx.restore();
}
function drawRacer(r,x,t,alpha,sc){
  if(r.rus>0&&r.trail.length>2){
    ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.globalAlpha=.75;
    RAINBOW.forEach((col,b)=>{ ctx.strokeStyle=col; ctx.lineWidth=6; ctx.beginPath();
      r.trail.forEach((ty,k)=>{ const px=x-20-k*30, py=ty-72+b*6+Math.sin(t*10-k*.6)*3; k?ctx.lineTo(px,py):ctx.moveTo(px,py) }); ctx.stroke() });
    ctx.restore();
    for(const k of [9,6,3]) drawCat(ctx,r,x-k*16,r.trail[k]||r.y,t-k*.02,alpha*(.12+.05*(9-k)/3),sc);
  }
  drawCat(ctx,r,x,r.y,t,alpha,sc);
}
function nameTag(r,x,y,me){
  const txt=r.human===2?'2P':r.human===1?(G.mode==='duo'?'1P':'나'):r.name;
  ctx.font=(me?'700 12px ':'600 11px ')+FONT_NUM; const w=ctx.measureText(txt).width+14;
  ctx.fillStyle=me?SKINS[r.skin].accent:'rgba(255,253,251,.88)'; rr(ctx,x+20-w/2,y-16,w,18,9); ctx.fill();
  ctx.fillStyle=me?'#FFFDFB':'#2E3A4B'; ctx.textAlign='center'; ctx.fillText(txt,x+20,y-3);
}
function drawHUD(r,vi,t){
  const top=10, rightPad=vi===0?66:12;
  ctx.textAlign='left';
  // left: place or hearts
  if(G.mode==='solo'){ for(let i=0;i<3;i++){ctx.globalAlpha=i<r.hearts?1:.25;ctx.fillStyle='#F2A3A0';heartPath(ctx,22+i*26,top+14,1);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke()} ctx.globalAlpha=1 }
  else { ctx.fillStyle='rgba(255,253,251,.85)'; rr(ctx,10,top,78,40,14); ctx.fill(); ctx.fillStyle=r.place===1?'#E39A55':'#2E3A4B'; ctx.font='700 28px '+FONT_NUM; const pw=ctx.measureText(String(r.place)).width; ctx.fillText(r.place,22,top+31);
    ctx.font='15px '+FONT_DISP; ctx.fillStyle='#6B7A8C'; ctx.fillText('위 / '+G.racers.length,26+pw,top+29) }
  // center: progress
  const bw=Math.min(300,W*.34), bx=W/2-bw/2, by=top+16;
  ctx.fillStyle='rgba(255,253,251,.7)'; rr(ctx,bx-10,by-10,bw+20,20,10); ctx.fill();
  ctx.fillStyle='#D5DEE6'; rr(ctx,bx,by-2,bw,4,2); ctx.fill();
  ctx.fillStyle='#E39A55'; rr(ctx,bx,by-2,bw*clamp(r.x/G.C.len,0,1),4,2); ctx.fill();
  for(let i=0;i<4;i++){ctx.fillStyle=i%2?'#2E3A4B':'#FFFDFB';ctx.fillRect(bx+bw+2,by-6+i*3,4,3)}
  const sorted=[...G.racers].sort((a,b)=>(a===r)-(b===r));
  for(const o of sorted){const p=clamp(o.x/G.C.len,0,1), px=bx+bw*p, rad=o===r?10:7;
    ctx.fillStyle=o===r?'#FFFDFB':SKINS[o.skin].accent; ctx.beginPath(); ctx.arc(px,by,rad+2,0,7); ctx.fill();
    if(SKINS[o.skin].face) ctx.drawImage(SKINS[o.skin].face,px-rad,by-rad,rad*2,rad*2)}
  ctx.font='600 11px '+FONT_NUM; const lab=STAGES[G.stage].name+'  ·  '+fmtTime(G.t), lw=ctx.measureText(lab).width+18; ctx.fillStyle='rgba(255,253,251,.7)'; rr(ctx,W/2-lw/2,by+12,lw,18,9); ctx.fill(); ctx.fillStyle='#4A5668'; ctx.textAlign='center'; ctx.fillText(lab,W/2,by+25);
  { const gw=Math.min(250,W*.36), gx=W/2-gw/2+12, gy=top+56, f=r.rus>0?r.rus/RUS_T:r.rg/RUS_N, wig=r.wig;
    ctx.save(); ctx.translate(W/2,gy+8); ctx.scale(1+wig*.07,1+Math.sin(t*42)*wig*.12); ctx.rotate(Math.sin(t*33)*wig*.04); ctx.translate(-W/2,-(gy+8));
    if(r.rus>0){ctx.shadowColor=`hsl(${(t*300)%360},90%,70%)`;ctx.shadowBlur=16}
    ctx.fillStyle='rgba(255,253,251,.94)'; rr(ctx,gx-4,gy-4,gw+8,24,12); ctx.fill(); ctx.shadowBlur=0;
    ctx.save(); rr(ctx,gx,gy,gw,16,8); ctx.clip(); ctx.fillStyle='#EDEFF4'; ctx.fillRect(gx,gy,gw,16);
    const n=30, sw=gw/n, fw=gw*f;
    for(let i=0;i<n;i++){ if(i*sw>=fw) break; const hue=(i*11+t*(r.rus>0?280:50))%360, wy=Math.sin(i*.9+t*24)*wig*4;
      ctx.fillStyle=`hsl(${hue},88%,${r.rus>0?70:75}%)`; ctx.fillRect(gx+i*sw,gy+wy,Math.min(sw+1,fw-i*sw),16) }
    ctx.fillStyle='rgba(255,255,255,.5)'; ctx.fillRect(gx,gy+2,fw,4);
    for(let k=1;k<6;k++){ctx.fillStyle='rgba(255,255,255,.7)';ctx.fillRect(gx+gw*k/6-1,gy+11,2,5)}
    if(r.rus>0){ctx.fillStyle='#FFFFFF';for(let k=0;k<6;k++){star(ctx,gx+((t*110+k*47)%gw),gy+8+Math.sin(t*6+k)*4,2.5+Math.sin(t*9+k))}}
    ctx.restore();
    const fs=24+wig*7, face=SKINS[r.skin].face;
    ctx.fillStyle='#FFFDFB'; ctx.beginPath(); ctx.arc(gx-12,gy+8-wig*5,fs/2+2,0,7); ctx.fill(); if(face) ctx.drawImage(face,gx-12-fs/2,gy+8-wig*5-fs/2,fs,fs);
    if(r.rus>0){ctx.strokeStyle=`hsl(${(t*300)%360},90%,65%)`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(gx-12,gy+8,fs/2+3,0,7);ctx.stroke()}
    const lab2=r.rus>0?'루성태 '+r.rus.toFixed(1)+'초':'루성태까지 '+(RUS_N-r.rg);
    ctx.font='700 11px '+FONT_NUM; ctx.textAlign='center'; ctx.lineWidth=3; ctx.strokeStyle='rgba(255,255,255,.9)'; ctx.strokeText(lab2,gx+gw/2,gy+12); ctx.fillStyle=r.rus>0?'#7A4FB8':'#5A5068'; ctx.fillText(lab2,gx+gw/2,gy+12);
    ctx.restore();
    if(wig>.6) for(let k=0;k<2;k++){const hx=gx+fw+(Math.random()-.5)*10;ctx.fillStyle=RAINBOW[(Math.random()*7)|0];star(ctx,hx,gy-4-Math.random()*8,3)}
  }
  // right: item slot + churu
  const sx=W-rightPad-50;
  ctx.fillStyle='rgba(255,253,251,.88)'; rr(ctx,sx,top,50,50,14); ctx.fill();
  ctx.strokeStyle=r.item?'#E39A55':'rgba(46,58,75,.12)'; ctx.lineWidth=2; rr(ctx,sx+1,top+1,48,48,13); ctx.stroke();
  if(r.roll>0) drawItemIcon(ctx,r.rollIcon,sx+25,top+25,1.15);
  else if(r.item){ drawItemIcon(ctx,r.item,sx+25,top+25,1.25+.05*Math.sin(t*8)) }
  if(r.item&&r.roll<=0){ctx.font='12px '+FONT_DISP;ctx.fillStyle='#C97A36';ctx.textAlign='center';ctx.fillText(ITEMS[r.item].name,sx+25,top+66)}
  ctx.textAlign='right'; ctx.font='700 15px '+FONT_NUM; ctx.fillStyle='#2E3A4B';
  const ctext=G.mode==='solo'?r.churu+' / '+G.C.churuTotal:String(r.churu);
  const tw=ctx.measureText(ctext).width; ctx.fillStyle='rgba(255,253,251,.85)'; rr(ctx,sx-tw-42,top+12,tw+34,26,13); ctx.fill();
  ctx.fillStyle='#2E3A4B'; ctx.fillText(ctext,sx-14,top+30); drawChuru(ctx,sx-tw-26,top+25,2,false,0,0);
  // timers for effects
  let ex=10; const ey=VH-38;
  const chip=(label,frac,col)=>{ctx.font='12px '+FONT_DISP;const w=ctx.measureText(label).width+38;ctx.fillStyle='rgba(255,253,251,.85)';rr(ctx,ex,ey,w,24,12);ctx.fill();ctx.fillStyle=col;rr(ctx,ex+6,ey+15,(w-12)*frac,4,2);ctx.fill();ctx.fillStyle='#2E3A4B';ctx.textAlign='left';ctx.fillText(label,ex+10,ey+13);ex+=w+6};
  if(r.boost>0) chip('마따따비',r.boost/2.2,'#6FB38E');
  if(r.shield>0) chip('쿠션',r.shield/10,'#8DB8E4');
  if(r.magnet>0) chip('츄르 자석',r.magnet/7,'#E05A5A');
  if(r.fever>0) chip('츄르 러시',r.fever/5,'#F2B544');
  if(G.mode!=='solo'&&r.coins>0){ctx.textAlign='right';ctx.font='600 11px '+FONT_NUM;ctx.fillStyle='#6B7A8C';ctx.fillText('츄르 속도 +'+(r.coins*1.2).toFixed(0)+'%',W-12,VH-14)}
}
function render(now){
  const t=now/1000;
  ctx.setTransform(dpr*scale,0,0,dpr*scale,0,0);
  if(!G){ // idle backdrop
    const S=STAGES[menuStage]; drawBG(ctx,S,t*60); return }
  const foci=G.mode==='duo'?[G.racers[0],G.racers[1]]:[G.racers[0]];
  foci.forEach((f,i)=>renderView(i,f,t));
  if(G.mode==='duo'){ctx.fillStyle='#FFFDFB';ctx.fillRect(0,VH-2,W,4)}
  if(G.phase==='count'){const c=Math.ceil(G.count), f=G.count%1;
    ctx.fillStyle='rgba(46,58,75,.12)'; ctx.fillRect(0,0,W,VH*views);
    ctx.save(); ctx.translate(W/2,VH*views/2); ctx.scale(1+f*.4,1+f*.4); ctx.globalAlpha=Math.min(1,f*2+.2);
    ctx.font='90px '+FONT_DISP; ctx.textAlign='center'; ctx.lineWidth=10; ctx.strokeStyle='#FFFDFB'; ctx.strokeText(c,0,30); ctx.fillStyle='#E39A55'; ctx.fillText(c,0,30); ctx.restore();
    ctx.font='18px '+FONT_DISP; ctx.fillStyle='#2E3A4B'; ctx.textAlign='center'; ctx.fillText('Stage '+(G.stage+1)+' · '+STAGES[G.stage].name,W/2,VH*views/2+80)}
  if(G.goT>0){ctx.save();ctx.globalAlpha=Math.min(1,G.goT*2);ctx.font='80px '+FONT_DISP;ctx.textAlign='center';ctx.lineWidth=10;ctx.strokeStyle='#FFFDFB';ctx.strokeText('출발!',W/2,VH*views/2+20);ctx.fillStyle='#E39A55';ctx.fillText('출발!',W/2,VH*views/2+20);ctx.restore()}
}

/* =====================================================================
   12. LOOP + STATE
   ===================================================================== */
let state='title', last=0, menuStage=1;
function frame(now){
  let dt=Math.min(.033,(now-last)/1000||0); last=now;
  if(state==='play'&&G){ const n=window.__luruFast||1; for(let k=0;k<n;k++) update(dt*G.slow); music() }
  render(now);
  requestAnimationFrame(frame);
}
function show(id,on){$(id).hidden=!on}
function endRace(){
  if(!G||state!=='play') return;
  state='result'; $('pauseBtn').hidden=true; updatePlaces();
  const est=r=>r.finished?r.finishT:G.t+(G.C.len-r.x)/Math.max(200,r.v||G.base);
  const order=[...G.racers].sort((a,b)=>(a.dead-b.dead)||(est(a)-est(b)));
  const me=G.racers[0]; const si=G.stage; let stars=0, cleared=false, title='', img=ASSET.win, eyebrow='Stage '+(si+1)+' · '+STAGES[si].name;
  if(G.mode==='solo'){
    cleared=me.finished&&!me.dead;
    const ratio=me.churu/Math.max(1,G.C.churuTotal);
    stars=cleared?1+(ratio>=.5?1:0)+(ratio>=.8?1:0):0;
    title=cleared?'완주했어요!':'루루가 낮잠에 들었어요'; if(!cleared) img=ASSET.sleep;
    $('resRank').innerHTML='';
    $('resStats').innerHTML=`<span class="stat">츄르 <b>${me.churu}</b> / ${G.C.churuTotal}</span><span class="stat">시간 <b>${fmtTime(G.t)}</b></span><span class="stat">남은 하트 <b>${Math.max(0,me.hearts)}</b></span>`;
  } else {
    const myPlace=order.indexOf(me)+1;
    if(G.mode==='race'){ cleared=myPlace<=3; stars=cleared?4-myPlace:0; title=myPlace===1?'1등이에요!':cleared?myPlace+'등으로 완주!':'아쉽게 4등이에요'; if(!cleared) img=ASSET.sleep }
    else { const p1=order.indexOf(G.racers[0]), p2=order.indexOf(G.racers[1]); title=p1<p2?'1P '+G.racers[0].name+' 승리!':'2P '+G.racers[1].name+' 승리!'; }
    $('resRank').innerHTML=order.map((r,i)=>`<div class="${r.human?'me':''}"><span class="p">${i+1}위</span><span class="dot" style="background:${SKINS[r.skin].accent}"></span><span class="nm">${r.human===2?'2P ':r.human===1&&G.mode==='duo'?'1P ':''}${r.name}${r.human===1&&G.mode!=='duo'?' (나)':' · '+SKINS[r.skin].breed}</span><span class="tm">${r.finished?fmtTime(r.finishT):'—'}</span></div>`).join('');
    $('resStats').innerHTML=`<span class="stat">먹은 츄르 <b>${me.churu}</b></span>`;
  }
  if(G.mode!=='duo'){
    const key=G.mode; if(stars>save.stars[key][si]) save.stars[key][si]=stars;
    if(cleared&&si+1<STAGES.length) save.unlocked=Math.max(save.unlocked,si+2);
    persist();
  }
  $('resEyebrow').textContent=eyebrow; $('resTitle').textContent=title; $('resImg').src=img;
  $('resStars').innerHTML=G.mode==='duo'?'':'★'.repeat(stars)+'<i>'+'★'.repeat(3-stars)+'</i>';
  $('resStars').hidden=G.mode==='duo';
  const canNext=si+1<STAGES.length&&si+1<save.unlocked&&(cleared||G.mode==='duo');
  $('nextBtn').hidden=!canNext;
  $('nextBtn').textContent=canNext?'다음 스테이지':'';
  show('resOv',1); buildPad();
}
let curMode='race';
function openStages(mode){
  curMode=mode; G=null; views=1; resize(); state='stages';
  $('modeTitle').textContent={race:'고양이 레이스',solo:'혼자 달리기',duo:'둘이서 대결'}[mode];
  $('how').innerHTML=mode==='duo'
    ?'<span>1P <kbd>W</kbd> 점프 <kbd>S</kbd> 슬라이드 <kbd>왼쪽 Shift</kbd> 아이템</span><span>2P <kbd>↑</kbd> 점프 <kbd>↓</kbd> 슬라이드 <kbd>오른쪽 Shift</kbd> 아이템</span>'
    :'<span><kbd>Space</kbd> <kbd>↑</kbd> 점프 · 공중에서 한 번 더 2단</span><span><kbd>↓</kbd> 슬라이드</span><span><kbd>X</kbd> <kbd>Shift</kbd> 아이템</span><span><kbd>P</kbd> 쉬기</span>';
  const box=$('stages'); box.innerHTML='';
  STAGES.forEach((S,i)=>{
    const locked=i+1>save.unlocked, st=mode==='duo'?0:save.stars[mode==='solo'?'solo':'race'][i];
    const b=document.createElement('button'); b.className='st'; b.disabled=locked;
    b.innerHTML=`<canvas width="320" height="180" data-i="${i}"></canvas><span class="in"><span class="n">STAGE ${i+1}${locked?' · 잠김':''}</span><b>${S.name}</b>${mode==='duo'?'<span class="stars">&nbsp;</span>':`<span class="stars">${'★'.repeat(st)}<i>${'★'.repeat(3-st)}</i></span>`}</span>`;
    b.setAttribute('aria-label',`스테이지 ${i+1} ${S.name}${locked?' 잠김':''}`);
    b.onclick=()=>startGame(mode,i); box.appendChild(b);
  });
  drawStageThumbs();
  show('titleOv',0);show('resOv',0);show('pauseOv',0);show('stageOv',1);$('pauseBtn').hidden=true; buildPad();
}
function drawStageThumbs(){
  document.querySelectorAll('.st canvas').forEach(cn=>{
    const i=+cn.dataset.i, S=STAGES[i], g=cn.getContext('2d'); const sW=W; W=640;
    g.setTransform(.5,0,0,.5,0,-20); drawBG(g,S,i*900+200);
    const fake={skin:0,slide:0,ground:true,y:GROUND,stun:0,boost:0,fever:0,shield:0,squash:0,phase:1.2};
    const oldG=G; G=null; drawCat(g,fake,190,GROUND,0,1,1.1); G=oldG;
    const o={type:S.low[0],w:OBS[S.low[0]].w,h:OBS[S.low[0]].h,seed:1}; drawOb(g,o,400,1);
    W=sW;
  });
}
function toTitle(){G=null;views=1;resize();state='title';show('stageOv',0);show('resOv',0);show('pauseOv',0);show('titleOv',1);$('pauseBtn').hidden=true;$('starTotal').textContent=starTotal();buildPad()}
function pause(){if(state!=='play')return;state='pause';show('pauseOv',1)}
function resume(){state='play';show('pauseOv',0);last=performance.now()}
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{ensureAudio();openStages(b.dataset.mode)});
$('backBtn').onclick=toTitle;
$('pauseBtn').onclick=pause; $('resumeBtn').onclick=resume; $('quitBtn').onclick=()=>openStages(curMode);
$('retryBtn').onclick=()=>startGame(G.mode,G.stage);
$('nextBtn').onclick=()=>startGame(G.mode,G.stage+1);
$('selBtn').onclick=()=>openStages(G?G.mode:curMode);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});

/* ---------- keyboard ---------- */
addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(k)) e.preventDefault();
  if(e.repeat) return;
  if(k==='p'||k==='P'||k==='Escape'){ if(state==='play') pause(); else if(state==='pause') resume(); return }
  if(state!=='play'||!G) return;
  const r1=G.racers[0], r2=G.mode==='duo'?G.racers[1]:null;
  if(G.mode==='duo'){
    if(k==='w'||k==='W') jump(r1); if(k==='s'||k==='S'){r1.downKey=true;slide(r1)} if(e.code==='ShiftLeft') useItem(r1);
    if(k==='ArrowUp') jump(r2); if(k==='ArrowDown'){r2.downKey=true;slide(r2)} if(e.code==='ShiftRight') useItem(r2);
  } else {
    if(k===' '||k==='ArrowUp'||k==='w'||k==='W') jump(r1);
    if(k==='ArrowDown'||k==='s'||k==='S'){r1.downKey=true;slide(r1)}
    if(k==='x'||k==='X'||k==='Shift'||k==='ArrowRight'||k==='d'||k==='D') useItem(r1);
  }
});
addEventListener('keyup',e=>{
  if(!G) return; const k=e.key, r1=G.racers[0], r2=G.mode==='duo'?G.racers[1]:null;
  if(G.mode==='duo'){ if(k==='w'||k==='W') jumpUp(r1); if(k==='s'||k==='S') r1.downKey=false; if(k==='ArrowUp') jumpUp(r2); if(k==='ArrowDown') r2.downKey=false }
  else { if(k===' '||k==='ArrowUp'||k==='w'||k==='W') jumpUp(r1); if(k==='ArrowDown'||k==='s'||k==='S') r1.downKey=false }
});
/* ---------- touch ---------- */
let tStart=null;
cv.addEventListener('pointerdown',e=>{ if(state!=='play'||!G||G.mode==='duo') return; e.preventDefault(); ensureAudio(); tStart={y:e.clientY,used:false} });
cv.addEventListener('pointermove',e=>{ if(!tStart||tStart.used) return; if(e.clientY-tStart.y>28){tStart.used=true;G.racers[0].downKey=true;slide(G.racers[0],.5)} });
cv.addEventListener('pointerup',()=>{ if(!tStart) return; const r=G.racers[0]; if(!tStart.used){jump(r);setTimeout(()=>jumpUp(r),140)} else r.downKey=false; tStart=null });
cv.addEventListener('pointercancel',()=>{tStart=null; if(G) G.racers[0].downKey=false});
const IC={
  up:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 16V5M5 10l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  down:'<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v11M5 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  item:'<svg viewBox="0 0 20 20" aria-hidden="true"><rect x="3" y="7" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h14M10 7v10M10 7c-2-4-6-3-4 0M10 7c2-4 6-3 4 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
};
function buildPad(){
  const pad=$('pad'); pad.innerHTML=''; pad.classList.toggle('on',state==='play'||state==='pause');
  if(!(state==='play'||state==='pause')||!G) return;
  const grp=(r,two,label)=>{const g=document.createElement('div');g.className='grp'+(two?' two':'');
    if(label) g.insertAdjacentHTML('beforeend',`<span class="tag">${label}</span>`);
    const mk=(cls,html,aria,down,up)=>{const b=document.createElement('button');b.className='pad '+cls;b.innerHTML=html;b.setAttribute('aria-label',aria);
      b.addEventListener('pointerdown',e=>{e.preventDefault();ensureAudio();b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}down()});
      const off=()=>{b.classList.remove('on');up&&up()}; b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
      b.addEventListener('contextmenu',e=>e.preventDefault()); g.appendChild(b)};
    mk('',IC.down+(two?'':'슬라이드'),'슬라이드',()=>{r.downKey=true;slide(r,.15)},()=>{r.downKey=false});
    if(G.mode!=='solo'||true) mk('item',IC.item+(two?'':'아이템'),'아이템',()=>useItem(r));
    mk('jump',IC.up+(two?'':'점프'),'점프',()=>jump(r),()=>jumpUp(r));
    pad.appendChild(g)};
  if(G.mode==='duo'){grp(G.racers[0],true,'1P');grp(G.racers[1],true,'2P')} else grp(G.racers[0],false);
}

/* boot */
$('starTotal').textContent=starTotal();
resize(); requestAnimationFrame(t=>{last=t;frame(t)});
window.__luru={get G(){return G},startGame,endRace,openStages};
})();
</script>
